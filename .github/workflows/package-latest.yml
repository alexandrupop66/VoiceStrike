name: Package VoiceStrike latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: BUILD 7 validator
        run: npm run validate:build7

      - name: Command-context regression
        run: npm run test:command-context

      - name: Create ZIP
        run: |
          zip -r VoiceStrike-latest.zip .             -x ".git/*"                "node_modules/*"                "client/node_modules/*"                "server/node_modules/*"                "VoiceStrike-latest.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStrike-latest
          path: VoiceStrike-latest.zip
          if-no-files-found: error
          retention-days: 7
