name: VoiceStrike Required Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  required-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Full regression and production build
        run: npm run ci:required
